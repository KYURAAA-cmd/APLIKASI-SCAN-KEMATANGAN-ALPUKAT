name: avocado_scanner
description: "Real-time avocado ripeness detection using YOLOv8 and TensorFlow Lite."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # Core Dependencies
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  get_it: ^7.7.0

  # UI & Design
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0

  # Camera & Image Processing
  camera: ^0.10.6
  image_picker: ^1.0.7
  image: ^4.1.3
  path_provider: ^2.1.2

  # TensorFlow Lite
  tflite_flutter: ^0.12.1
  # tflite_flutter_helper: ^0.4.2 
  # CATATAN: Package ini sudah tidak tersedia di pub.dev.
  # Akan perlu diganti dengan package helper lain (misal: 'image') saat implementasi ML (Tahap 5).

  # Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0+2
  path: ^1.8.3

  # Storage & Permissions
  permission_handler: ^11.3.1
  device_info_plus: ^9.1.1
  package_info_plus: ^4.1.1
  shared_preferences: ^2.1.0

  # Networking (if needed for future features)
  http: ^1.2.1
  dio: ^5.4.3+1

  # Serialization
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1

  # Logging & Debugging
  logger: ^2.3.0
  talker: ^4.2.0

  # Date & Time
  intl: ^0.19.0

  # File Management
  file_picker: ^8.0.3
  mime: ^1.0.4

  # Utility
  connectivity_plus: ^6.0.3
  internet_connection_checker: ^1.0.0+1
  equatable: ^2.0.5
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.6
  freezed_annotation: ^2.4.1
  freezed: ^2.5.2

  # Testing
  mocktail: ^1.0.3
  mockito: ^5.4.4

  # Linting & Analysis
  # Memperbaiki nama package dari 'lint' menjadi 'lints' dan menyelaraskan versi.
  flutter_lints: ^4.0.0

  # Debugging
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/model/
    - assets/images/
    - assets/icons/

  # Fonts (optional, if using Google Fonts)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700

# Platform Configuration
platforms:
  android:
  ios:
